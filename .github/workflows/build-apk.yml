name: S8LL • Build APK

on:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - "functions/**"
      - "firestore-tests/**"
      - "firestore.rules"
      - "ui-preview/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "app/**"
      - "functions/**"
      - "firestore-tests/**"
      - "firestore.rules"
      - "ui-preview/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: # Manual button in GitHub

jobs:
  firestore-rules-tests:
    name: Firestore security rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        # The Firestore emulator is a JVM app.
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./firestore-tests

      - name: Run rules tests against the Firestore emulator
        run: npm run test:emulator
        working-directory: ./firestore-tests

  build-functions:
    name: Build payments backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./functions

      - name: Lint
        run: npm run lint
        working-directory: ./functions

      - name: Test
        run: npm test
        working-directory: ./functions

      - name: Build
        run: npm run build
        working-directory: ./functions

  build-apk:
    name: Build S8LL APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v
        working-directory: ./app

      - name: Get dependencies
        run: flutter pub get
        working-directory: ./app

      - name: Analyze
        run: flutter analyze
        working-directory: ./app

      - name: Run tests
        run: flutter test
        working-directory: ./app

      - name: Build APK
        # Deliberately not --split-per-abi: a single universal APK is the
        # right tradeoff for a side-loaded pop-up build where size isn't
        # the constraint.
        #
        # Root cause of every prior CI failure here (flutter/flutter#174620):
        # this project declares AGP/Kotlin via the modern settings.gradle
        # plugins {} block, not a root build.gradle buildscript {} block.
        # Flutter's post-build step that copies the APK into
        # build/app/outputs/flutter-apk/ never triggers in that setup, so
        # `flutter build apk` reported a generic "couldn't find the APK"
        # failure even when Gradle had genuinely succeeded. Fixed with a
        # Copy task in app/build.gradle; -v stays on as a safety net so a
        # real failure (if this doesn't fully cover it) isn't hidden again.
        run: flutter build apk --release -v
        working-directory: ./app

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: S8LL-universal-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build Summary
        run: |
          VERSION=$(grep '^version:' app/pubspec.yaml | awk '{print $2}')
          echo "### S8LL APK built successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Size:** $(du -h app/build/app/outputs/flutter-apk/app-release.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the APK from the Artifacts section of this run." >> "$GITHUB_STEP_SUMMARY"

  ui-preview-apk:
    name: Build v2 UI preview APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true

      # ui-preview holds only lib/ and pubspec.yaml — the Android/Gradle
      # scaffolding is generated here rather than committed, so there is one
      # less copy of it in the tree to drift.
      - name: Generate platform scaffolding
        run: flutter create --org com.s8ll --project-name s8ll_app --platforms=android .
        working-directory: ./ui-preview

      - name: Get dependencies
        run: flutter pub get
        working-directory: ./ui-preview

      - name: Analyze
        # Errors only. This is an imported design prototype, not code held to
        # the main app's lint bar, and failing the build on its style warnings
        # would stop the APK anyone actually wants to look at.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: ./ui-preview

      - name: Build APK
        run: flutter build apk --release
        working-directory: ./ui-preview

      # Locate the APK rather than assuming a path: Flutter's post-build copy
      # into flutter-apk/ doesn't fire on the modern settings.gradle plugins
      # layout (flutter/flutter#174620), which is what broke this repo's other
      # APK job until a Gradle Copy task was added there.
      - name: Collect APK
        run: |
          set -e
          APK=$(find build -name "*release*.apk" -print -quit)
          test -n "$APK"
          mkdir -p out
          cp "$APK" out/S8LL-v2-ui-preview.apk
          ls -lh out/
        working-directory: ./ui-preview

      - name: Upload v2 UI preview APK
        uses: actions/upload-artifact@v4
        with:
          name: S8LL-v2-ui-preview
          path: ui-preview/out/S8LL-v2-ui-preview.apk
          retention-days: 30
