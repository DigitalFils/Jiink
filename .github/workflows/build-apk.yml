name: S8LL • Build APK

on:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - "functions/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "app/**"
      - "functions/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: # Manual button in GitHub

jobs:
  build-functions:
    name: Build payments backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./functions

      - name: Lint
        run: npm run lint
        working-directory: ./functions

      - name: Test
        run: npm test
        working-directory: ./functions

      - name: Build
        run: npm run build
        working-directory: ./functions

  build-apk:
    name: Build S8LL APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v
        working-directory: ./app

      - name: Get dependencies
        run: flutter pub get
        working-directory: ./app

      - name: Analyze
        run: flutter analyze
        working-directory: ./app

      - name: Run tests
        run: flutter test
        working-directory: ./app

      - name: Build APK
        # Deliberately not --split-per-abi: a single universal APK is the
        # right tradeoff for a side-loaded pop-up build where size isn't
        # the constraint.
        #
        # Root cause of every prior CI failure here (flutter/flutter#174620):
        # this project declares AGP/Kotlin via the modern settings.gradle
        # plugins {} block, not a root build.gradle buildscript {} block.
        # Flutter's post-build step that copies the APK into
        # build/app/outputs/flutter-apk/ never triggers in that setup, so
        # `flutter build apk` reported a generic "couldn't find the APK"
        # failure even when Gradle had genuinely succeeded. Fixed with a
        # Copy task in app/build.gradle; -v stays on as a safety net so a
        # real failure (if this doesn't fully cover it) isn't hidden again.
        run: flutter build apk --release -v
        working-directory: ./app

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: S8LL-universal-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build Summary
        run: |
          VERSION=$(grep '^version:' app/pubspec.yaml | awk '{print $2}')
          echo "### S8LL APK built successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Size:** $(du -h app/build/app/outputs/flutter-apk/app-release.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the APK from the Artifacts section of this run." >> "$GITHUB_STEP_SUMMARY"
