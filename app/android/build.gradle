allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// buildDir (plain property assignment) is deprecated; layout.buildDirectory
// is the supported replacement as of Gradle 8+/9. Keeps the same target
// (app/build) this project has always used.
def newBuildDir = rootProject.layout.buildDirectory.dir("../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    def newSubprojectBuildDir = newBuildDir.dir(project.name)
    project.layout.buildDirectory.value(newSubprojectBuildDir)
}
subprojects {
    project.evaluationDependsOn(":app")
}

// stripe_android's own Kotlin source (PushProvisioningProxy.kt etc.)
// references classes from stripe-android-issuing-push-provisioning (Google
// Pay card issuing — a feature we don't use, only PaymentSheet checkout),
// declared compileOnly, so it genuinely needs that module to compile —
// excluding it project-wide broke stripe_android's own compilation.
//
// The actual problem is one level deeper: that module's POM pulls in
// com.google.android.gms:play-services-tapandpay:17.1.2, which Google no
// longer publishes anywhere resolvable, and Android Lint's "lint vital"
// classpath (releaseLintChecksClasspath — wired into every release build
// for every library module by AGP; lint.checkReleaseBuilds=false does not
// stop it) tries to resolve it. Excluding just that one leaf artifact, only
// from lint's own classpath configurations, fixes lint's resolution without
// touching what stripe_android needs to actually compile.
subprojects { subproject ->
    subproject.configurations.matching { it.name.endsWith("LintChecksClasspath") }.configureEach {
        exclude group: "com.google.android.gms", module: "play-services-tapandpay"
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
