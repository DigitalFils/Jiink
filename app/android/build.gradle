allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// buildDir (plain property assignment) is deprecated; layout.buildDirectory
// is the supported replacement as of Gradle 8+/9. Keeps the same target
// (app/build) this project has always used.
def newBuildDir = rootProject.layout.buildDirectory.dir("../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    def newSubprojectBuildDir = newBuildDir.dir(project.name)
    project.layout.buildDirectory.value(newSubprojectBuildDir)
}
subprojects {
    project.evaluationDependsOn(":app")
}

// AGP runs a "lint vital" check on every Android library module as part of
// assembleRelease. stripe_android's lint-checks classpath depends on an old
// Google Play Services artifact (play-services-tapandpay) that Google no
// longer publishes, which fails dependency resolution outright — nothing to
// do with any lint finding. We don't own that plugin's build.gradle, so
// disable release lint checks for library subprojects instead.
subprojects {
    afterEvaluate { subproject ->
        if (subproject.plugins.hasPlugin("com.android.library")) {
            subproject.android {
                lint {
                    checkReleaseBuilds = false
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
