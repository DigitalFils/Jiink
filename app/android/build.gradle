allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// buildDir (plain property assignment) is deprecated; layout.buildDirectory
// is the supported replacement as of Gradle 8+/9. Keeps the same target
// (app/build) this project has always used.
def newBuildDir = rootProject.layout.buildDirectory.dir("../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    def newSubprojectBuildDir = newBuildDir.dir(project.name)
    project.layout.buildDirectory.value(newSubprojectBuildDir)
}
subprojects {
    project.evaluationDependsOn(":app")
}

// stripe_android declares stripe-android-issuing-push-provisioning (Google
// Pay card issuing — a feature we don't use, only PaymentSheet checkout) as
// compileOnly. Its POM pulls in com.google.android.gms:play-services-
// tapandpay:17.1.2, which Google no longer publishes anywhere resolvable.
// Android Lint's "lint vital" analysis (which AGP wires into every release
// build for every library module, including this one) resolves compileOnly
// dependencies too, so it hits this every time regardless of any lint
// setting — checkReleaseBuilds=false does not stop it. Excluding the module
// from dependency resolution project-wide is the fix that actually reaches
// lint's classpath, not just the app's own compile/runtime classpaths.
subprojects { subproject ->
    subproject.configurations.all {
        exclude group: "com.stripe", module: "stripe-android-issuing-push-provisioning"
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
