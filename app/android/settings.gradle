pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // AGP/Kotlin versions match Flutter 3.47.2's own template defaults
    // (flutter_tools/lib/src/android/gradle_utils.dart) — that's the
    // combination this Flutter version actually validates against, and
    // AGP 9 requires Gradle 9.3.1 (see gradle-wrapper.properties).
    id "com.android.application" version "9.1.0" apply false
    // Stripe's Android SDK (payments-core, pulled in by flutter_stripe) ships
    // classes compiled with Kotlin 2.1 metadata — the compiler needs to be at
    // least that new to read them.
    id "org.jetbrains.kotlin.android" version "2.4.0" apply false
    // Reads android/app/google-services.json and generates the resources
    // FirebaseApp.initializeApp() looks up at runtime — applied (without
    // apply false) in app/build.gradle.
    id "com.google.gms.google-services" version "4.4.2" apply false
}

include ":app"
