name: s8ll
description: "S8LL — snap it, sell it."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  provider: ^6.1.2
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  firebase_messaging: ^16.0.4
  cloud_functions: ^6.2.0
  flutter_stripe: ^14.0.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  # Bundled rather than fetched at runtime (which is what the google_fonts
  # package does): the pop-up runs on venue wifi, and a font that arrives
  # over the network means the first launch there renders in the fallback
  # face — or doesn't render as intended at all if the connection drops.
  # Only the weights actually used are shipped; Medium (500) isn't one.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
