<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Accounting Dashboard Prototype</title>
    <!-- React & Babel via CDN for quick prototyping -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      .container { max-width: 900px; margin: 0 auto; }
      table { width: 100%; border-collapse: collapse; margin-top: 10px; }
      th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; }
      th { background: #f5f5f5; }
      form > div { margin-bottom: 8px; }
      input, select { padding: 4px 6px; }
      button { padding: 6px 12px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Accounting Dashboard Prototype</h1>
      <div id="root"></div>
    </div>

    <!-- Inline React code for demo purposes -->
    <script type="text/babel">
      const { useState } = React;

      /* Chart of Accounts List */
      function ChartOfAccounts({ accounts }) {
        return (
          <section>
            <h2>Chart of Accounts</h2>
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Type</th>
                </tr>
              </thead>
              <tbody>
                {accounts.map((acc) => (
                  <tr key={acc.id}>
                    <td>{acc.name}</td>
                    <td>{acc.type}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </section>
        );
      }

      /* Income / Expense Entry Form */
      function EntryForm({ accounts, onAdd }) {
        const [form, setForm] = useState({
          date: "",
          description: "",
          accountId: accounts[0]?.id || "",
          amount: "",
        });

        function handleChange(e) {
          const { name, value } = e.target;
          setForm((f) => ({ ...f, [name]: value }));
        }

        function handleSubmit(e) {
          e.preventDefault();
          if (!form.date || !form.description || !form.amount || !form.accountId) return;
          onAdd({ ...form, amount: parseFloat(form.amount) });
          setForm((f) => ({ ...f, description: "", amount: "" }));
        }

        return (
          <section>
            <h2>Add Income / Expense</h2>
            <form onSubmit={handleSubmit}>
              <div>
                <label>
                  Date:
                  <input type="date" name="date" value={form.date} onChange={handleChange} required />
                </label>
              </div>
              <div>
                <label>
                  Description:
                  <input type="text" name="description" value={form.description} onChange={handleChange} required />
                </label>
              </div>
              <div>
                <label>
                  Account:
                  <select name="accountId" value={form.accountId} onChange={handleChange}>
                    {accounts.map((acc) => (
                      <option key={acc.id} value={acc.id}>
                        {acc.name}
                      </option>
                    ))}
                  </select>
                </label>
              </div>
              <div>
                <label>
                  Amount:
                  <input
                    type="number"
                    step="0.01"
                    name="amount"
                    value={form.amount}
                    onChange={handleChange}
                    required
                  />
                </label>
              </div>
              <button type="submit">Add Entry</button>
            </form>
          </section>
        );
      }

      /* Very Simplified Balance Sheet */
      function BalanceSheet({ accounts, entries }) {
        const totals = { Asset: 0, Liability: 0, Equity: 0, Revenue: 0, Expense: 0 };
        entries.forEach((entry) => {
          const account = accounts.find((a) => a.id === entry.accountId);
          if (account) {
            totals[account.type] += entry.amount;
          }
        });
        // Simplistic profit computation: Revenue + Expense (Expense should be negative for outflows)
        const equityWithProfit = totals.Equity + (totals.Revenue + totals.Expense);

        return (
          <section>
            <h2>Balance Sheet (simplified)</h2>
            <table>
              <tbody>
                <tr>
                  <td>Assets</td>
                  <td>{totals.Asset.toFixed(2)}</td>
                </tr>
                <tr>
                  <td>Liabilities</td>
                  <td>{totals.Liability.toFixed(2)}</td>
                </tr>
                <tr>
                  <td>Equity</td>
                  <td>{equityWithProfit.toFixed(2)}</td>
                </tr>
              </tbody>
            </table>
          </section>
        );
      }

      /* Tax Summary (US federal, single filer, simplified) */
      function TaxSummary({ accounts, entries }) {
        // Calculate profit = revenue + expenses (expenses are negative numbers)
        let profit = 0;
        entries.forEach((entry) => {
          const account = accounts.find((a) => a.id === entry.accountId);
          if (!account) return;
          if (account.type === "Revenue" || account.type === "Expense") {
            profit += entry.amount;
          }
        });

        // US Federal Income Tax 2024 brackets (single filer)
        const brackets = [
          { limit: 11000, rate: 0.10 },
          { limit: 44725, rate: 0.12 },
          { limit: 95375, rate: 0.22 },
          { limit: 182100, rate: 0.24 },
          { limit: 231250, rate: 0.32 },
          { limit: 578125, rate: 0.35 },
          { limit: Infinity, rate: 0.37 },
        ];

        function computeFederalTax(income) {
          let remaining = income;
          let lower = 0;
          let tax = 0;
          for (const { limit, rate } of brackets) {
            const taxableAtThisRate = Math.min(remaining, limit - lower);
            if (taxableAtThisRate <= 0) break;
            tax += taxableAtThisRate * rate;
            remaining -= taxableAtThisRate;
            lower = limit;
          }
          return tax;
        }

        const federalIncomeTax = computeFederalTax(Math.max(0, profit));
        // Simplified self-employment tax (15.3% of profit; ignores wage base cap)
        const selfEmploymentTax = profit > 0 ? profit * 0.153 : 0;
        const totalTax = federalIncomeTax + selfEmploymentTax;

        return (
          <section>
            <h2>Tax Summary (est.)</h2>
            <table>
              <tbody>
                <tr>
                  <td>Profit</td>
                  <td>{profit.toFixed(2)}</td>
                </tr>
                <tr>
                  <td>Federal Income Tax (est.)</td>
                  <td>{federalIncomeTax.toFixed(2)}</td>
                </tr>
                <tr>
                  <td>Self-Employment Tax (est.)</td>
                  <td>{selfEmploymentTax.toFixed(2)}</td>
                </tr>
                <tr>
                  <td><strong>Total Estimated Tax</strong></td>
                  <td><strong>{totalTax.toFixed(2)}</strong></td>
                </tr>
              </tbody>
            </table>
            <p style={{ fontSize: "0.8em", color: "#666" }}>
              *This is a simplified estimate for a US sole proprietor (single filer). Actual tax may differ.
            </p>
          </section>
        );
      }

      /* Root Component */
      function App() {
        const initialAccounts = [
          { id: "cash", name: "Cash", type: "Asset" },
          { id: "bank", name: "Bank", type: "Asset" },
          { id: "sales", name: "Sales Revenue", type: "Revenue" },
          { id: "expenses", name: "Operating Expense", type: "Expense" },
          { id: "equity", name: "Owner Equity", type: "Equity" },
        ];

        const [accounts] = useState(initialAccounts);
        const [entries, setEntries] = useState([]);

        function addEntry(entry) {
          setEntries((e) => [...e, { ...entry, id: Date.now().toString() }]);
        }

        return (
          <>
            <ChartOfAccounts accounts={accounts} />
            <EntryForm accounts={accounts} onAdd={addEntry} />
            <BalanceSheet accounts={accounts} entries={entries} />
            <TaxSummary accounts={accounts} entries={entries} />
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
